services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: migrate
      POSTGRES_PASSWORD: migrate
      POSTGRES_DB: migrate
    ports:
      - '54329:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U migrate -d migrate']
      interval: 2s
      timeout: 3s
      retries: 15
